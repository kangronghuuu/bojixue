<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="520" height="560">
  <g stroke="#221D14" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- palm -->
    <g transform="translate(130,120)">
      <rect x="-46" y="-26" width="92" height="84" rx="16" fill="#F8ECCC"/>
      <rect x="-40" y="-78" width="16" height="56" rx="8" fill="#F8ECCC"/>
      <rect x="-16" y="-86" width="16" height="64" rx="8" fill="#F8ECCC"/>
      <rect x="8" y="-80" width="16" height="58" rx="8" fill="#F8ECCC"/>
      <rect x="32" y="-66" width="15" height="44" rx="7" fill="#F8ECCC"/>
