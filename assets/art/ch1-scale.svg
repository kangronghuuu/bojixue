<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <pattern id="s-ht" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#221D14" opacity=".25"/></pattern>
  </defs>
  <!-- frame -->
  <text x="60" y="42" font-family="PingFang SC" font-size="19" letter-spacing="1.5" fill="#B0862C">FIG. 1-3　一周体重波动示意</text>
  <path d="M60 52 L300 52" stroke="#B0862C" stroke-width="1.2"/>

  <!-- axes -->
  <g stroke="#221D14" stroke-width="2">
    <path d="M80 80 L80 360 M80 360 L840 360"/>
  </g>
  <g font-family="PingFang SC" font-size="18" fill="#7E7258">
    <text x="62" y="92" text-anchor="end">kg</text>
    <text x="62" y="200" text-anchor="end">71</text>
    <text x="62" y="270" text-anchor="end">70</text>
    <text x="62" y="340" text-anchor="end">69</text>
    <text x="150" y="384">第 1 周</text>
    <text x="330" y="384">第 2 周</text>
    <text x="510" y="384">第 3 周</text>
    <text x="690" y="384">第 4 周</text>
  </g>

  <!-- normal fluctuation band -->
  <path d="M80 168 C160 156 240 176 320 160 C400 146 480 172 560 156 C640 140 720 168 800 152
           L800 288 C720 304 640 276 560 292 C480 308 400 282 320 298 C240 314 160 294 80 306 Z"
        fill="#E9DFC4" opacity=".75"/>
  <path d="M80 168 C160 156 240 176 320 160 C400 146 480 172 560 156 C640 140 720 168 800 152"
        fill="none" stroke="#B0862C" stroke-width="1.4" stroke-dasharray="5 4" opacity=".8"/>

  <!-- daily dots -->
  <g fill="#7E7258">
    <circle cx="100" cy="238" r="4"/><circle cx="124" cy="252" r="4"/><circle cx="148" cy="226" r="4"/>
    <circle cx="172" cy="264" r="4"/><circle cx="196" cy="230" r="4"/><circle cx="220" cy="248" r="4"/>
    <circle cx="244" cy="222" r="4"/><circle cx="268" cy="256" r="4"/><circle cx="292" cy="234" r="4"/>
    <circle cx="316" cy="250" r="4"/><circle cx="340" cy="240" r="4"/><circle cx="364" cy="262" r="4"/>
    <circle cx="388" cy="226" r="4"/><circle cx="412" cy="252" r="4"/><circle cx="436" cy="230" r="4"/>
    <circle cx="460" cy="258" r="4"/><circle cx="484" cy="236" r="4"/><circle cx="508" cy="250" r="4"/>
    <circle cx="532" cy="222" r="4"/><circle cx="556" cy="260" r="4"/><circle cx="580" cy="238" r="4"/>
    <circle cx="604" cy="268" r="4"/><circle cx="628" cy="246" r="4"/><circle cx="652" cy="262" r="4"/>
    <circle cx="676" cy="234" r="4"/><circle cx="700" cy="256" r="4"/><circle cx="724" cy="240" r="4"/>
    <circle cx="748" cy="270" r="4"/><circle cx="772" cy="250" r="4"/><circle cx="796" cy="262" r="4"/>
  </g>

  <!-- moving average -->
  <path d="M100 230 C180 238 240 236 320 244 C400 252 460 252 540 258 C620 264 700 268 800 274"
        fill="none" stroke="#221D14" stroke-width="4" stroke-linecap="round"/>

  <!-- annotations -->
  <g font-family="PingFang SC" font-size="19">
    <text x="520" y="196" fill="#7A5F1E">水分与糖原造成的日常摆动（±1–2 kg）</text>
    <path d="M700 204 L660 226" stroke="#B0862C" stroke-width="1.4"/>
    <text x="560" y="330" fill="#221D14">四周移动平均：真正的方向</text>
    <path d="M690 322 L640 296" stroke="#221D14" stroke-width="1.4"/>
    <text x="120" y="150" fill="#7E7258">单日读数：记录可以，解释不必</text>
    <path d="M232 158 L196 210" stroke="#7E7258" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- legend -->
  <g transform="translate(620,415)">
    <circle cx="0" cy="0" r="4" fill="#7E7258"/>
    <text x="14" y="4" font-family="PingFang SC" font-size="16" fill="#7E7258">单日体重</text>
    <path d="M100 0 L130 0" stroke="#221D14" stroke-width="3"/>
    <text x="140" y="4" font-family="PingFang SC" font-size="16" fill="#7E7258">7 日均线</text>
  </g>
</svg>
